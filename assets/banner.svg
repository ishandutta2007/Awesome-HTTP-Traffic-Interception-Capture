<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <linearGradient id="wire-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.55; }
      }
      @keyframes packetFlow1 {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(860px); opacity: 0; }
      }
      @keyframes packetFlow2 {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(860px); opacity: 0; }
      }
      @keyframes mitmPulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0,242,254,0.6)); stroke: #00f2fe; }
        50% { filter: drop-shadow(0 0 18px rgba(255,75,110,0.8)); stroke: #ff4b6e; }
      }
      @keyframes badgeBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .anim-orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; }
      .anim-orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; }
      .anim-packet-1 { animation: packetFlow1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-packet-2 { animation: packetFlow2 4s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s; }
      .anim-mitm { animation: mitmPulse 4s ease-in-out infinite; }
      .anim-badge { animation: badgeBob 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Orbs in Background -->
  <circle class="anim-orb-1" cx="220" cy="100" r="140" fill="#00f2fe" filter="url(#glow)" opacity="0.15" />
  <circle class="anim-orb-2" cx="980" cy="240" r="160" fill="#ff4b6e" filter="url(#glow)" opacity="0.12" />

  <!-- Dynamic Traffic Pipeline (Background / Wireframe) -->
  <g opacity="0.75">
    <!-- Stream Flow Lines -->
    <path d="M 160 280 L 1040 280" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 160 280 Q 600 240 1040 280" stroke="rgba(0,242,254,0.18)" stroke-width="1.5" />

    <!-- Animated Data Packets (Client to Server through Interceptor) -->
    <g class="anim-packet-1">
      <circle cx="170" cy="280" r="5" fill="#00f2fe" filter="url(#glow)" />
      <rect x="180" y="274" width="28" height="12" rx="4" fill="rgba(0,242,254,0.25)" stroke="#00f2fe" stroke-width="1" />
      <text x="194" y="283" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">GET</text>
    </g>
    <g class="anim-packet-2">
      <circle cx="170" cy="280" r="5" fill="#ff4b6e" filter="url(#glow)" />
      <rect x="180" y="274" width="34" height="12" rx="4" fill="rgba(255,75,110,0.25)" stroke="#ff4b6e" stroke-width="1" />
      <text x="197" y="283" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">200 OK</text>
    </g>

    <!-- Node 1: Client -->
    <g transform="translate(160, 280)">
      <circle r="18" fill="#111827" stroke="#4facfe" stroke-width="2" />
      <text y="4" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle">APP</text>
      <text y="30" fill="#64748b" font-size="10" text-anchor="middle">Client / Browser</text>
    </g>

    <!-- Node 2: Interceptor / MITM Proxy Core -->
    <g transform="translate(600, 280)">
      <circle r="22" fill="#1e1b4b" class="anim-mitm" stroke-width="2.5" />
      <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text y="32" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">MITM PROXY</text>
    </g>

    <!-- Node 3: Remote Server / Cloud -->
    <g transform="translate(1040, 280)">
      <circle r="18" fill="#111827" stroke="#a78bfa" stroke-width="2" />
      <text y="4" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">API</text>
      <text y="30" fill="#64748b" font-size="10" text-anchor="middle">Target Server</text>
    </g>
  </g>

  <!-- FOREGROUND: Clear Title, Subtitle, and Feature Tags (Unobscured) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Super Title Tag -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-14" width="280" height="26" rx="13" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <text y="4" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">⚡ HTTP / HTTPS TRAFFIC WORKBENCH</text>
    </g>

    <!-- Main Title -->
    <text y="58" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome HTTP Traffic Interception &amp; Capture
    </text>

    <!-- Subtitle -->
    <text y="92" fill="#94a3b8" font-size="15" font-weight="400">
      Curated MITM Proxies, Dynamic Security Workbenches, Packet Sniffers &amp; Request Replayers
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 130)">
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="4" fill="#e2e8f0" font-size="11" font-weight="600">🛡️ MITM Proxies</text>
      </g>
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="4" fill="#e2e8f0" font-size="11" font-weight="600">🔍 DAST &amp; Pentesting</text>
      </g>
      <g transform="translate(80, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="4" fill="#e2e8f0" font-size="11" font-weight="600">⚡ API Mock &amp; Tamper</text>
      </g>
      <g transform="translate(240, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="4" fill="#e2e8f0" font-size="11" font-weight="600">📦 Packet Capture</text>
      </g>
    </g>
  </g>
</svg>
